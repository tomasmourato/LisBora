# Logging for GraphHopper during `pipeline build` (slf4j-simple).
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
# Thousands of per-relation warnings about broken OSM turn restrictions; counted in the QA report instead.
org.slf4j.simpleLogger.log.com.graphhopper.osm_warnings=error
