# Weekly data update: rebuilds the data pack from its sources (CML cycle network, GIRA stations,
# OpenStreetMap, elevation), runs the quality checks and, only when the data changed and every check
# passed, publishes it to the `datapack` release, where the app looks for updates (see docs/PLANO.md, phase 6).
name: Dados

on:
  schedule:
    # Mondays at 04:30 UTC, after Geofabrik's nightly Portugal extract.
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      basemap:
        description: "Extrair também o mapa base (Protomaps, ~18 MB a descarregar por cada telemóvel)"
        type: boolean
        default: false
      publicar:
        description: "Publicar se os dados mudaram e o QA passou"
        type: boolean
        default: true

permissions:
  contents: write # creates and updates the datapack release

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PACK: pipeline/work/datapack
      RELEASE: pipeline/work/release
      TAG: datapack
      GH_TOKEN: ${{ github.token }}
      # Only the pipeline: no Android SDK or app configuration needed.
      GRADLE: ./gradlew --console=plain -Plisbora.semApp=true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Mosaicos de elevação em cache
        uses: actions/cache@v6
        with:
          path: pipeline/work/dem
          key: dem-${{ hashFiles('core/routing/src/main/kotlin/pt/lisbora/routing/geo/ServiceArea.kt') }}

      - name: Testes do router e do pipeline
        run: |
          chmod +x gradlew
          $GRADLE :core:routing:test :pipeline:test

      - name: Partir do pacote publicado
        # The files this run does not rebuild (the base map, most weeks) stay as published.
        run: |
          mkdir -p "$PACK"
          cp app/src/main/assets/datapack/* "$PACK"/
          $GRADLE :pipeline:run --args="pull --out $PACK"

      - name: Rede ciclável da CML
        # If the CML service fails or looks wrong, the pack keeps the network it has.
        continue-on-error: true
        run: $GRADLE :pipeline:run --args="fetch-cml --out $PACK"

      - name: Estações GIRA
        # Unofficial API (see CLAUDE.md): if it fails, the pack keeps the stations it has.
        continue-on-error: true
        run: $GRADLE :pipeline:run --args="gira --out $PACK"

      - name: Grafo de rotas, QA e rotas de referência
        run: $GRADLE :pipeline:run --args="build --out $PACK --cml $PACK/ciclovias.geojson"

      - name: Pesquisa e pontos de interesse
        run: $GRADLE :pipeline:run --args="search --out $PACK"

      - name: Descobertas de referência
        run: $GRADLE :pipeline:run --args="discover --graph $PACK/graph.lbg --pois $PACK/pois.geojson"

      - name: Mapa base
        # Monthly (the first Monday) or on request: it changes every day and weighs 18 MB.
        env:
          ON_REQUEST: ${{ inputs.basemap == true }}
        run: |
          if [ "$ON_REQUEST" != "true" ] && { [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(date -u +%-d)" -gt 7 ]; }; then
            echo "O mapa base fica como está (só na primeira segunda-feira do mês ou a pedido)."
            exit 0
          fi
          mkdir -p pipeline/work/tools
          curl -sSfL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
            | tar -xz -C pipeline/work/tools pmtiles
          $GRADLE :pipeline:run --args="basemap --out $PACK"

      - name: Preparar a publicação
        id: release
        run: |
          $GRADLE :pipeline:run --args="release --out $PACK"
          if [ -f "$RELEASE/manifest.json" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publicar no release datapack
        if: steps.release.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.publicar)
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # A pre-release, so it never shows as the app's latest release.
            gh release create "$TAG" --prerelease --title "Dados da LisBora" --notes-file "$RELEASE/notes.md"
          fi
          # New files first and the manifest last: phones only see the new pack once all its files are there.
          shopt -s nullglob
          assets=("$RELEASE"/assets/*)
          if [ ${#assets[@]} -gt 0 ]; then gh release upload "$TAG" "${assets[@]}" --clobber; fi
          gh release upload "$TAG" "$RELEASE/manifest.json" --clobber
          gh release edit "$TAG" --notes-file "$RELEASE/notes.md"
          # Files that neither this pack nor the one before it uses.
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/existing.txt"
          sort "$RELEASE/keep.txt" > "$RUNNER_TEMP/keep.txt"
          comm -23 "$RUNNER_TEMP/existing.txt" "$RUNNER_TEMP/keep.txt" | while read -r name; do
            gh release delete-asset "$TAG" "$name" --yes
          done

      - name: Relatório QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-${{ github.run_number }}
          path: |
            pipeline/work/qa
            pipeline/work/release/notes.md
            pipeline/work/datapack/manifest.json
          if-no-files-found: ignore
